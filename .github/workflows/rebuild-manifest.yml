name: Auto-Build Manifest

on:
  push:
    paths:
      - 'books/**'
      - 'build-manifest.js'
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Manifest
        run: node build-manifest.js

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add app-manifest.yml
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update manifest [skip ci]"
          git push
