<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Volvo XC60 — Личный справочник и дневник эксплуатации">
  <meta name="theme-color" content="#1b1b1b">
  <title>Volvo XC60: Справочник</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
  <link rel="stylesheet" href="app.css">
  <script>
    // Fix for GitHub Pages subdirectories without trailing slash
    (function() {
      const path = window.location.pathname;
      if (path.length > 1 && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
        window.location.replace(path + '/');
      }
    })();
  </script>
</head>
<body>

<!-- ── LOGIN SCREEN (VOLVO IGNITION) ──────────────────── -->
<div id="login-screen">
  <div id="ignition-module">
    <div id="ignition-knob-wrap">
      <div id="ignition-knob">
        <span id="ignition-label">START<br>STOP</span>
        <div id="ignition-dot"></div>
      </div>
    </div>
    <div id="login-status">READY TO START</div>
    
    <div id="pin-pad" style="display:none">
      <div id="pin-display">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="pin-grid">
        <button onclick="addPin('1')">1</button><button onclick="addPin('2')">2</button><button onclick="addPin('3')">3</button>
        <button onclick="addPin('4')">4</button><button onclick="addPin('5')">5</button><button onclick="addPin('6')">6</button>
        <button onclick="addPin('7')">7</button><button onclick="addPin('8')">8</button><button onclick="addPin('9')">9</button>
        <button onclick="clearPin()">C</button><button onclick="addPin('0')">0</button><button onclick="checkPin()">OK</button>
      </div>
    </div>
  </div>
</div>

<!-- ── MOBILE OVERLAY ────────────────────────────────── -->
<div id="overlay"></div>

<!-- ── APP SHELL ─────────────────────────────────────── -->
<div id="app">

  <!-- PREMIUM FLOATING PLAYER -->
  <div id="premium-player">
    <div id="player-track-info">
      <div id="player-status-dot"></div>
      <span id="music-info">STANDING BY</span>
    </div>
    <div id="player-controls">
      <button class="player-btn" onclick="AudioEngine.playPrev()" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 18V6z" fill="currentColor"/></svg>
      </button>
      <button class="player-btn main-action" id="music-play" onclick="AudioEngine.togglePlay()" title="Play/Pause">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      </button>
      <button class="player-btn" onclick="AudioEngine.playNext()" title="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12v12h2V6z" fill="currentColor"/></svg>
      </button>
      <div class="player-divider"></div>
      <button class="player-btn" onclick="AudioEngine.toggle()" id="sound-toggle-premium" title="Mute/Unmute">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-logo">
        <svg viewBox="0 0 100 100" width="28" height="28">
          <circle cx="50" cy="50" r="38" fill="none" stroke="white" stroke-width="6"/>
          <path d="M78 22 L92 8 L92 30" fill="none" stroke="white" stroke-width="6" stroke-linecap="square"/>
          <rect x="10" y="44" width="80" height="12" fill="white"/>
        </svg>
      </div>
      <span id="sidebar-title" style="font-family: serif; letter-spacing: 0.15em; font-weight: 400;">VOLVO</span>
      <span id="sidebar-badge">XC60</span>
    </div>

    <div id="sidebar-search-wrap">
      <input type="text" id="sidebar-search" placeholder="Поиск…" autocomplete="off">
    </div>

    <div id="sidebar-nav"></div>

    <div id="sidebar-footer">
      <div id="user-indicator">
        <div id="user-dot"></div>
        <span id="user-role-label">Владелец</span>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <button id="menu-toggle">☰</button>
      <div id="page-breadcrumb"></div>
      
      <div style="flex:1"></div>
      <div id="topbar-actions">
        <button class="topbar-btn" onclick="updateFontSize(-1)">A−</button>
        <button class="topbar-btn" onclick="updateFontSize(1)">A+</button>
        <button class="topbar-btn" id="sound-toggle" onclick="AudioEngine.toggle()">🔊</button>
        <button class="topbar-btn" id="theme-toggle">🌙</button>
      </div>
    </div>

    <div id="content-area">
      <p class="loading-msg">Инициализация…</p>
    </div>
  </div>
</div>

<!-- ── LIBS (Local for offline PWA) ── -->
<script src="./libs/js-yaml.min.js"></script>
<script src="./libs/marked.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
