<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volvo XC60 — Редактор</title>
  <link rel="stylesheet" href="app.css">
  <style>
    body { overflow: auto; background: var(--bg-sidebar); }
    #app { display: block; height: auto; overflow: visible; }

    /* ── EDITOR LAYOUT ─────────────────────── */
    #editor-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #editor-topbar {
      height: 60px;
      background: var(--bg-sidebar);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
      flex-shrink: 0;
    }
    #editor-topbar-logo { font-size: 24px; }
    #editor-topbar-title {
      color: #fff; font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: 0.1em;
    }
    #editor-topbar-file {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-gold);
      background: rgba(255,255,255,0.05);
      padding: 4px 10px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #editor-topbar-actions { margin-left: auto; display: flex; gap: 8px; }
    .ed-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .ed-btn:hover { border-color: #fff; color: #fff; }
    .ed-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .ed-btn.primary:hover { background: var(--accent-light); }

    /* ── PANELS ────────────────────────────── */
    #editor-body {
      flex: 1;
      display: flex;
      gap: 0;
      min-height: calc(100vh - 60px);
    }
    #editor-panel, #preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #editor-panel { border-right: 1px solid var(--border); background: var(--bg); }

    .panel-header {
      padding: 10px 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #md-editor {
      flex: 1;
      width: 100%;
      background: transparent;
      color: #ccc;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.8;
      border: none;
      outline: none;
      padding: 24px;
      resize: none;
    }
    #preview-panel { overflow-y: auto; background: var(--bg); }
    #preview-content {
      padding: 32px;
      flex: 1;
    }

    /* ── MANIFEST BROWSER ──────────────────── */
    #manifest-sidebar {
      width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #manifest-list { flex: 1; overflow-y: auto; padding: 10px 0; }
    .ms-section-title {
      padding: 12px 20px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-sidebar-muted);
    }
    .ms-item {
      padding: 8px 20px 8px 36px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-sidebar);
      transition: all 0.2s;
    }
    .ms-item:hover { background: var(--bg-hover); color: #fff; }
    .ms-item.active { background: var(--bg-active); color: #fff; }

    #status-bar {
      height: 28px;
      background: #000;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 20px;
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    @media (max-width: 900px) {
      #manifest-sidebar { display: none; }
    }
  </style>
</head>
<body>
<div id="editor-shell">

  <!-- TOP BAR -->
  <div id="editor-topbar">
    <span id="editor-topbar-logo">🚗</span>
    <span id="editor-topbar-title">Volvo XC60 Editor</span>
    <span id="editor-topbar-file">Файл не выбран</span>
    <div id="editor-topbar-actions">
      <button class="ed-btn" onclick="copyContent()">Копировать</button>
      <button class="ed-btn" onclick="window.close()">Закрыть</button>
    </div>
  </div>

  <div id="editor-body">
    <!-- MANIFEST BROWSER -->
    <div id="manifest-sidebar">
      <div id="manifest-list"><div style="padding:20px;color:var(--text-muted);font-size:12px">Загрузка…</div></div>
    </div>

    <!-- EDITOR -->
    <div id="editor-panel">
      <div class="panel-header">📝 Редактирование</div>
      <textarea id="md-editor" spellcheck="false" placeholder="Выберите файл слева…"></textarea>
    </div>

    <!-- PREVIEW -->
    <div id="preview-panel">
      <div class="panel-header">👁 Предпросмотр</div>
      <div id="preview-content" class="md-body">
        <p style="color:var(--text-muted)">Выберите файл для предпросмотра.</p>
      </div>
    </div>
  </div>

  <div id="status-bar">
    <span id="sb-file">Нет файла</span>
    <span id="sb-lines">0 строк</span>
    <span style="margin-left:auto">Volvo Handbook Editor v2.0</span>
  </div>
</div>

<script src="./libs/js-yaml.min.js"></script>
<script src="./libs/marked.min.js"></script>
<script>
'use strict';

const savedTheme = localStorage.getItem('volvo-theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);

let currentFile = null;
let manifest = null;

const editor = document.getElementById('md-editor');
const preview = document.getElementById('preview-content');
const sbFile = document.getElementById('sb-file');
const sbLines = document.getElementById('sb-lines');
const fileLabel = document.getElementById('editor-topbar-file');

editor.addEventListener('input', () => {
  renderPreview();
  sbLines.textContent = editor.value.split('\n').length + ' строк';
});

function renderPreview() {
  const text = editor.value;
  const body = text.replace(/^---[\s\S]*?---\n/, '');
  preview.innerHTML = marked.parse(body);
}

async function loadFile(filePath) {
  try {
    const resp = await fetch(filePath + '?t=' + Date.now());
    const text = await resp.text();
    editor.value = text;
    currentFile = filePath;
    fileLabel.textContent = filePath;
    sbFile.textContent = filePath.split('/').pop();
    renderPreview();
    sbLines.textContent = text.split('\n').length + ' строк';
  } catch(e) {
    editor.value = '# Ошибка\nНе удалось загрузить файл.';
  }
}

async function loadManifest() {
  try {
    const text = await fetch('./app-manifest.yml').then(r => r.text());
    manifest = jsyaml.load(text);
    buildManifestList();
  } catch(e) {}
}

function buildManifestList() {
  const list = document.getElementById('manifest-list');
  let html = '';
  for (const section of manifest.sections) {
    html += `<div class="ms-section-title">${section.icon} ${section.title}</div>`;
    for (const item of section.items) {
      html += `<div class="ms-item" onclick="selectItem('${item.file}', this)">${item.title}</div>`;
    }
  }
  list.innerHTML = html;
}

function selectItem(filePath, el) {
  document.querySelectorAll('.ms-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  loadFile(filePath);
}

function copyContent() {
  navigator.clipboard.writeText(editor.value).then(() => {
    alert('Текст скопирован в буфер обмена');
  });
}

const urlFile = new URLSearchParams(location.search).get('file');
if (urlFile) loadFile(urlFile);
loadManifest();
</script>
</body>
</html>
