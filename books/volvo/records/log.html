<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Бортовой журнал</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --gold-dim: #8a6d3b;
            --bg: #0e0e0e;
            --panel: #181818;
            --panel2: #202020;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --muted: #606060;
            --blue: #4facfe;
            --green: #43e97b;
            --pink: #fa709a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            margin: 0; padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            overflow: hidden;
        }

        /* ── SHELL ── */
        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh; /* dynamic viewport height — учитывает адресную строку браузера */
        }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--panel);
        }
        .topbar-title {
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            letter-spacing: 0.12em;
            color: var(--gold);
            text-transform: uppercase;
        }
        .topbar-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }

        /* ── PAGES ── */
        .page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .page.active { display: flex; }

        /* ── BOTTOM NAV ── */
        .bottom-nav {
            display: flex;
            border-top: 1px solid var(--border);
            background: var(--panel);
            flex-shrink: 0;
        }
        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 0 12px;
            gap: 4px;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.15s;
            position: relative;
        }
        .nav-btn .icon { font-size: 20px; line-height: 1; }
        .nav-btn.active { color: var(--gold); }
        .nav-btn.active::before {
            content: '';
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 2px;
            background: var(--gold);
            border-radius: 0 0 2px 2px;
        }

        /* ══════════════════════════════
           PAGE: ADD
        ══════════════════════════════ */
        #page-add {
            overflow-y: auto;
            padding: 14px 14px 20px;
            gap: 12px;
        }
        #page-add::-webkit-scrollbar { display: none; }

        /* Тип — большие кнопки */
        .type-picker {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .type-card {
            background: var(--panel);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .type-card .tc-icon { font-size: 22px; }
        .type-card.selected {
            border-color: var(--gold);
            background: #1e1700;
            color: var(--gold);
        }

        /* Форма */
        .form-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field label {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.1em;
            font-weight: 500;
        }
        .field input,
        .field textarea {
            background: #111;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 11px 12px;
            border-radius: 6px;
            font-size: 15px;
            font-family: 'IBM Plex Mono', monospace;
            width: 100%;
            -webkit-appearance: none;
        }
        .field input:focus,
        .field textarea:focus { border-color: var(--gold); outline: none; background: #141000; }
        .field textarea { resize: none; line-height: 1.5; }

        .save-btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.15s;
        }
        .save-btn:active { opacity: 0.75; }
        .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #status {
            text-align: center;
            font-size: 12px;
            min-height: 18px;
            letter-spacing: 0.05em;
        }
        .success { color: var(--green); }
        .error { color: var(--pink); }

        /* ══════════════════════════════
           PAGE: VIEW
        ══════════════════════════════ */
        #page-view { overflow: hidden; }

        .view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }
        .record-count { font-size: 11px; color: var(--muted); }
        .refresh-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.15s, border-color 0.15s;
        }
        .refresh-btn:active { color: var(--gold); border-color: var(--gold); }
        .refresh-icon { display: inline-block; transition: transform 0.5s; }
        .refresh-icon.spinning { animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Фильтры */
        .filter-bar {
            display: flex;
            gap: 6px;
            padding: 8px 14px;
            overflow-x: auto;
            flex-shrink: 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 11px;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
            font-family: 'IBM Plex Mono', monospace;
            flex-shrink: 0;
            transition: 0.15s;
        }
        .filter-chip.active { background: #1e1700; border-color: var(--gold); color: var(--gold); }

        /* Список */
        #records-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        #records-list::-webkit-scrollbar { width: 3px; }
        #records-list::-webkit-scrollbar-thumb { background: var(--border); }

        .record-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn { from { opacity:0; transform:translateY(6px); } }

        .record-top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px 10px;
            border-left: 3px solid;
        }
        .record-icon { font-size: 20px; flex-shrink: 0; }
        .record-main { flex: 1; min-width: 0; }
        .record-title {
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            letter-spacing: 0.04em;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .record-date { font-size: 10px; color: var(--muted); margin-top: 2px; }
        .record-price {
            font-family: 'Oswald', sans-serif;
            font-size: 17px;
            color: var(--gold);
            flex-shrink: 0;
        }
        .record-mileage {
            font-size: 11px;
            color: var(--muted);
            padding: 0 14px 6px;
        }
        .record-content {
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
            padding: 0 14px 12px;
            border-top: 1px solid var(--border);
            padding-top: 8px;
            margin-top: 2px;
        }

        .state-msg {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--muted);
            font-size: 12px;
            gap: 10px;
            padding: 40px;
            text-align: center;
        }
        .state-msg .big { font-size: 36px; }
    </style>
</head>
<body>
<div class="app">

    <!-- TOP BAR -->
    <div class="topbar">
        <div>
            <div class="topbar-title">🚗 Бортовой журнал</div>
        </div>
        <div class="topbar-sub" id="sync-status">●&nbsp;ГОТОВ</div>
    </div>

    <!-- PAGE: ADD -->
    <div class="page active" id="page-add">

        <!-- Выбор типа -->
        <div class="type-picker">
            <div class="type-card selected" data-type="log" onclick="selectType('log')">
                <span class="tc-icon">🛠️</span>Журнал ТО
            </div>
            <div class="type-card" data-type="note" onclick="selectType('note')">
                <span class="tc-icon">📝</span>Заметка
            </div>
            <div class="type-card" data-type="remind" onclick="selectType('remind')">
                <span class="tc-icon">🏁</span>Событие
            </div>
        </div>

        <!-- Форма -->
        <div class="form-card" id="form-card">
            <div id="form-fields"></div>
        </div>

        <button class="save-btn" id="save-btn" onclick="submitForm()">Сохранить</button>
        <div id="status"></div>

    </div>

    <!-- PAGE: VIEW -->
    <div class="page" id="page-view">
        <div class="view-header">
            <span class="record-count" id="record-count">—</span>
            <button class="refresh-btn" onclick="loadRecords()">
                <span class="refresh-icon" id="refresh-icon">↻</span> Обновить
            </button>
        </div>
        <div class="filter-bar">
            <div class="filter-chip active" data-filter="all" onclick="setFilter('all')">Все</div>
            <div class="filter-chip" data-filter="log" onclick="setFilter('log')">🛠️ ТО</div>
            <div class="filter-chip" data-filter="note" onclick="setFilter('note')">📝 Заметки</div>
            <div class="filter-chip" data-filter="remind" onclick="setFilter('remind')">🏁 События</div>
        </div>
        <div id="records-list">
            <div class="state-msg"><span class="big">📋</span>Нет загруженных записей</div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="nav-add" onclick="showPage('add')">
            <span class="icon">✚</span>Добавить
        </button>
        <button class="nav-btn" id="nav-view" onclick="showPage('view')">
            <span class="icon">☰</span>Журнал
        </button>
    </div>

</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxe9ABv21rfuSxFkl0Pywk3LH--LP_MexhmhUKRRHAA1yRDhf9781-gWz_MRta19pqY/exec';

let currentType = 'log';
let currentFilter = 'all';
let allRecords = [];

// ── NAVIGATION ──
function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + name));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.id === 'nav-' + name));
    if (name === 'view' && allRecords.length === 0) loadRecords();
}

// ── TYPE SELECTOR ──
function selectType(type) {
    currentType = type;
    document.querySelectorAll('.type-card').forEach(c => c.classList.toggle('selected', c.dataset.type === type));
    renderFormFields();
}

function renderFormFields() {
    const today = new Date().toISOString().split('T')[0];
    let html = '';
    if (currentType === 'log') {
        html = `
            <div class="field-row">
                <div class="field"><label>Дата</label><input type="date" id="f-date" value="${today}"></div>
                <div class="field"><label>Пробег (км)</label><input type="number" id="f-mileage" placeholder="120000" inputmode="numeric"></div>
            </div>
            <div class="field"><label>Вид работы</label><input type="text" id="f-title" placeholder="Замена масла..."></div>
            <div class="field"><label>Стоимость (₪)</label><input type="text" id="f-price" placeholder="450" inputmode="decimal"></div>
        `;
    } else if (currentType === 'note') {
        html = `
            <div class="field"><label>Заголовок</label><input type="text" id="f-title" placeholder="Тема заметки..."></div>
            <div class="field"><label>Текст</label><textarea id="f-content" rows="4" placeholder="Текст..."></textarea></div>
        `;
    } else {
        html = `
            <div class="field"><label>Событие</label><input type="text" id="f-title" placeholder="ТО у дилера..."></div>
            <div class="field-row">
                <div class="field"><label>Дата</label><input type="date" id="f-date" value="${today}"></div>
                <div class="field"><label>Напомнить за (дн)</label><input type="number" id="f-remind" value="7" inputmode="numeric"></div>
            </div>
        `;
    }
    document.getElementById('form-fields').innerHTML = html;
}
renderFormFields();

// ── SUBMIT ──
async function submitForm() {
    const title = document.getElementById('f-title')?.value?.trim();
    if (!title) { setStatus('Заполните обязательные поля', 'error'); return; }

    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    setStatus('Синхронизация...', '');

    const data = {
        type: currentType,
        timestamp: new Date().toISOString(),
        title,
        date: document.getElementById('f-date')?.value || '',
        mileage: document.getElementById('f-mileage')?.value || '',
        price: document.getElementById('f-price')?.value || '',
        content: document.getElementById('f-content')?.value || '',
        remind_before: document.getElementById('f-remind')?.value || '',
    };

    try {
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        setStatus('✓ Запись сохранена!', 'success');
        resetForm();
        // Добавляем в локальный список без перезагрузки
        allRecords.unshift(data);
        setTimeout(() => { setStatus('', ''); showPage('view'); renderRecords(); }, 1200);
    } catch(e) {
        setStatus('Ошибка сети', 'error');
    } finally {
        btn.disabled = false;
    }
}

function resetForm() {
    renderFormFields();
}

function setStatus(msg, cls) {
    const el = document.getElementById('status');
    el.innerHTML = msg ? `<span class="${cls}">${msg}</span>` : '';
}

// ── LOAD RECORDS ──
async function loadRecords() {
    const icon = document.getElementById('refresh-icon');
    icon.classList.add('spinning');
    setSyncStatus('СИНХРОНИЗАЦИЯ...');

    try {
        const res = await fetch(SCRIPT_URL + '?action=get&v=' + Date.now());
        const json = await res.json();
        allRecords = (json.rows || []).reverse();
        renderRecords();
        setSyncStatus('● СИНХРОНИЗИРОВАНО');
    } catch(e) {
        showError('Ошибка загрузки: ' + e.message);
        setSyncStatus('● ОШИБКА', true);
    } finally {
        icon.classList.remove('spinning');
    }
}

function setSyncStatus(text, err) {
    const el = document.getElementById('sync-status');
    el.textContent = text;
    el.style.color = err ? 'var(--pink)' : 'var(--muted)';
}

// ── FILTER ──
function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
    renderRecords();
}

// ── RENDER ──
function renderRecords() {
    const list = document.getElementById('records-list');
    const filtered = currentFilter === 'all' ? allRecords : allRecords.filter(r => r.type === currentFilter);

    document.getElementById('record-count').textContent = filtered.length + ' записей';

    if (filtered.length === 0) {
        list.innerHTML = `<div class="state-msg"><span class="big">📭</span>Нет записей в этой категории</div>`;
        return;
    }

    list.innerHTML = filtered.map(r => {
        const icon  = r.type === 'log' ? '🛠️' : r.type === 'note' ? '📝' : '🏁';
        const color = r.type === 'log' ? 'var(--blue)' : r.type === 'note' ? 'var(--green)' : 'var(--pink)';
        const dateStr = r.date || (r.timestamp ? new Date(r.timestamp).toLocaleDateString('ru-RU') : '');
        return `
        <div class="record-card">
          <div class="record-top" style="border-left-color:${color}">
            <span class="record-icon">${icon}</span>
            <div class="record-main">
              <div class="record-title">${esc(r.title || '')}</div>
              <div class="record-date">${dateStr}</div>
            </div>
            ${r.price ? `<div class="record-price">${esc(String(r.price))} ₪</div>` : ''}
          </div>
          ${r.mileage ? `<div class="record-mileage">📍 ${esc(String(r.mileage))} км</div>` : ''}
          ${r.content ? `<div class="record-content">${esc(String(r.content))}</div>` : ''}
        </div>`;
    }).join('');
}

function showError(msg) {
    document.getElementById('records-list').innerHTML = `<div class="state-msg"><span class="big">⚠️</span>${msg}</div>`;
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
