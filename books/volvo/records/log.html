<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бортовой журнал</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --bg: #0e0e0e;
            --panel: #181818;
            --border: #2a2a2a;
            --text: #e8e8e8;
            --muted: #606060;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; padding: 12px; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px;
        }
        .header-title { font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase; }
        .sync-status { font-size: 10px; color: var(--muted); }

        .section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
        .section-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); }
        .section-title { font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 8px; }
        .section-arrow { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
        .section.collapsed .section-arrow { transform: rotate(-90deg); }
        .section-body { padding: 14px; }
        .section.collapsed .section-body { display: none; }

        .type-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .type-card {
            background: #111; border: 1.5px solid var(--border); border-radius: 8px;
            padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px;
            cursor: pointer; transition: 0.15s; font-size: 10px; color: var(--muted);
            letter-spacing: 0.05em; text-transform: uppercase;
        }
        .type-card .tc-icon { font-size: 22px; }
        .type-card.selected { border-color: var(--gold); background: #1e1700; color: var(--gold); }

        .form-fields { display: flex; flex-direction: column; gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field label { font-size: 9px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.1em; }
        .field input, .field textarea {
            background: #111; border: 1px solid var(--border); color: var(--text);
            padding: 11px 12px; border-radius: 6px; font-size: 15px;
            font-family: 'IBM Plex Mono', monospace; width: 100%; -webkit-appearance: none;
        }
        .field input:focus, .field textarea:focus { border-color: var(--gold); outline: none; }
        .field textarea { resize: none; line-height: 1.5; }

        .save-btn {
            background: var(--gold); color: #000; border: none; padding: 14px; border-radius: 8px;
            font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600;
            letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 10px;
        }
        .save-btn:active { opacity: 0.75; }
        .save-btn:disabled { opacity: 0.4; }

        #status { text-align: center; font-size: 12px; min-height: 18px; margin-top: 8px; }
        .success { color: #43e97b; }
        .error { color: #fa709a; }

        /* Iframe для просмотра — растягивается по содержимому через JS */
        #viewer-frame {
            width: 100%;
            border: none;
            display: block;
            min-height: 200px;
        }

        .refresh-btn {
            background: transparent; border: 1px solid var(--border); color: var(--muted);
            padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer;
            font-family: 'IBM Plex Mono', monospace; margin-bottom: 10px;
        }
        .refresh-btn:active { border-color: var(--gold); color: var(--gold); }
    </style>
</head>
<body>

<div class="header">
    <div class="header-title">🚗 Бортовой журнал</div>
    <div class="sync-status" id="sync-status">● ГОТОВ</div>
</div>

<!-- ДОБАВИТЬ -->
<div class="section" id="section-add">
    <div class="section-header" onclick="toggleSection('add')">
        <div class="section-title">✚ Добавить запись</div>
        <span class="section-arrow">▾</span>
    </div>
    <div class="section-body">
        <div class="type-picker">
            <div class="type-card selected" data-type="log" onclick="selectType('log')"><span class="tc-icon">🛠️</span>Журнал ТО</div>
            <div class="type-card" data-type="note" onclick="selectType('note')"><span class="tc-icon">📝</span>Заметка</div>
            <div class="type-card" data-type="remind" onclick="selectType('remind')"><span class="tc-icon">🏁</span>Событие</div>
        </div>
        <div class="form-fields" id="form-fields"></div>
        <button class="save-btn" id="save-btn" onclick="submitForm()">Сохранить</button>
        <div id="status"></div>
    </div>
</div>

<!-- ПРОСМОТР -->
<div class="section" id="section-view">
    <div class="section-header" onclick="toggleSection('view')">
        <div class="section-title">☰ Журнал записей</div>
        <span class="section-arrow">▾</span>
    </div>
    <div class="section-body">
        <button class="refresh-btn" onclick="refreshFrame()">↻ Обновить список</button>
        <iframe id="viewer-frame" src="about:blank" scrolling="no" onload="resizeFrame(this)"></iframe>
    </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxe9ABv21rfuSxFkl0Pywk3LH--LP_MexhmhUKRRHAA1yRDhf9781-gWz_MRta19pqY/exec';

let currentType = 'log';

function toggleSection(name) {
    document.getElementById('section-' + name).classList.toggle('collapsed');
}

function selectType(type) {
    currentType = type;
    document.querySelectorAll('.type-card').forEach(c => c.classList.toggle('selected', c.dataset.type === type));
    renderFormFields();
}

function renderFormFields() {
    const today = new Date().toISOString().split('T')[0];
    let html = '';
    if (currentType === 'log') {
        html = `
            <div class="field-row">
                <div class="field"><label>Дата</label><input type="date" id="f-date" value="${today}"></div>
                <div class="field"><label>Пробег (км)</label><input type="number" id="f-mileage" placeholder="120000" inputmode="numeric"></div>
            </div>
            <div class="field"><label>Вид работы</label><input type="text" id="f-title" placeholder="Замена масла..."></div>
            <div class="field"><label>Стоимость (₪)</label><input type="text" id="f-price" placeholder="450" inputmode="decimal"></div>`;
    } else if (currentType === 'note') {
        html = `
            <div class="field"><label>Заголовок</label><input type="text" id="f-title" placeholder="Тема заметки..."></div>
            <div class="field"><label>Текст</label><textarea id="f-content" rows="4" placeholder="Текст..."></textarea></div>`;
    } else {
        html = `
            <div class="field"><label>Событие</label><input type="text" id="f-title" placeholder="ТО у дилера..."></div>
            <div class="field-row">
                <div class="field"><label>Дата</label><input type="date" id="f-date" value="${today}"></div>
                <div class="field"><label>Напомнить за (дн)</label><input type="number" id="f-remind" value="7" inputmode="numeric"></div>
            </div>`;
    }
    document.getElementById('form-fields').innerHTML = html;
}
renderFormFields();

async function submitForm() {
    const title = document.getElementById('f-title')?.value?.trim();
    if (!title) { setStatus('Заполните обязательные поля', 'error'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    setStatus('Синхронизация...', '');
    const data = {
        type: currentType, timestamp: new Date().toISOString(), title,
        date: document.getElementById('f-date')?.value || '',
        mileage: document.getElementById('f-mileage')?.value || '',
        price: document.getElementById('f-price')?.value || '',
        content: document.getElementById('f-content')?.value || '',
        remind_before: document.getElementById('f-remind')?.value || '',
    };
    try {
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
        setStatus('✓ Запись сохранена!', 'success');
        renderFormFields();
        document.getElementById('section-add').classList.add('collapsed');
        document.getElementById('section-view').classList.remove('collapsed');
        setTimeout(() => { refreshFrame(); setStatus('', ''); }, 1000);
    } catch(e) {
        setStatus('Ошибка сети', 'error');
    } finally {
        btn.disabled = false;
    }
}

function setStatus(msg, cls) {
    document.getElementById('status').innerHTML = msg ? `<span class="${cls}">${msg}</span>` : '';
}

function refreshFrame() {
    const frame = document.getElementById('viewer-frame');
    frame.src = SCRIPT_URL + '?v=' + Date.now();
}

function resizeFrame(frame) {
    try {
        const h = frame.contentDocument.body.scrollHeight;
        if (h > 0) frame.style.height = h + 'px';
    } catch(e) {
        // cross-origin — ставим фиксированную большую высоту
        frame.style.height = '1200px';
    }
}
</script>
</body>
</html>
