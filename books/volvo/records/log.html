<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бортовой журнал и Дневник</title>
    <style>
        :root {
            --gold: #c5a059;
            --bg: #121212;
            --panel: #1e1e1e;
            --border: #333;
            --text: #e0e0e0;
            --text-muted: #808080;
        }
        body { font-family: 'IBM Plex Sans', sans-serif; color: var(--text); background: transparent; margin: 0; padding: 0; }
        .container { max-width: 100%; padding: 20px; }
        
        /* Табы */
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { 
            padding: 10px 20px; background: transparent; border: none; color: var(--text-muted); 
            cursor: pointer; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.1em;
            border-bottom: 2px solid transparent; transition: 0.2s;
        }
        .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }

        h2 { font-weight: 300; color: #fff; margin-bottom: 20px; font-size: 1.5rem; }
        
        form { background: var(--panel); padding: 20px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
        input, select, textarea { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 2px; font-family: inherit; }
        input:focus { border-color: var(--gold); outline: none; }
        
        button.submit-btn { background: #003057; color: #fff; border: none; padding: 12px 24px; cursor: pointer; border-radius: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; transition: 0.2s; margin-top: 20px; width: 100%; }
        button.submit-btn:hover { background: #004a87; }
        button.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .data-list { margin-top: 20px; display: grid; gap: 10px; }
        .data-item { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 4px; border-left: 4px solid var(--border); }
        .data-item.type-log { border-left-color: #4facfe; }
        .data-item.type-note { border-left-color: #43e97b; }
        .data-item.type-remind { border-left-color: #fa709a; }
        
        .item-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); }
        .item-title { font-weight: 600; color: #fff; font-size: 15px; margin-bottom: 5px; }
        .item-desc { font-size: 14px; color: #ccc; }
        .item-price { color: var(--gold); font-weight: 700; }

        .alert-box { background: rgba(250, 112, 154, 0.1); border: 1px solid #fa709a; padding: 15px; border-radius: 4px; margin-bottom: 20px; display: none; }
        .alert-box h3 { font-size: 14px; color: #fa709a; margin-bottom: 10px; text-transform: uppercase; }

        #status { margin-top: 10px; text-align: center; font-size: 13px; min-height: 1.5em; }
        .success { color: #4caf50; }
        .error { color: #f44336; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <!-- АЛЕРТЫ ДЛЯ НАПОМИНАНИЙ -->
        <div id="alert-section" class="alert-box">
            <h3>⚠️ Внимание: Предстоящие события</h3>
            <div id="alert-list"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('log')">Журнал ТО</button>
            <button class="tab-btn" onclick="switchTab('notes')">Заметки</button>
            <button class="tab-btn" onclick="switchTab('reminders')">Напоминания</button>
        </div>

        <!-- РАЗДЕЛ: ЖУРНАЛ ТО -->
        <div id="tab-log" class="tab-content active">
            <form id="form-log">
                <input type="hidden" name="type" value="log">
                <div class="form-grid">
                    <div class="field"><label>Дата</label><input type="date" name="date" required></div>
                    <div class="field"><label>Пробег (км)</label><input type="number" name="mileage" required></div>
                    <div class="field"><label>Работа / Запчасть</label><input type="text" name="title" placeholder="Замена масла" required></div>
                    <div class="field"><label>Стоимость</label><input type="text" name="price" placeholder="0.00"></div>
                </div>
                <button type="submit" class="submit-btn">Добавить в журнал</button>
            </form>
            <div id="list-log" class="data-list"></div>
        </div>

        <!-- РАЗДЕЛ: ЗАМЕТКИ -->
        <div id="tab-notes" class="tab-content">
            <form id="form-notes">
                <input type="hidden" name="type" value="note">
                <div class="field" style="margin-bottom:15px;"><label>Заголовок</label><input type="text" name="title" placeholder="Купить зимнюю резину" required></div>
                <div class="field"><label>Текст заметки</label><textarea name="content" rows="4" placeholder="Текст..."></textarea></div>
                <button type="submit" class="submit-btn">Сохранить заметку</button>
            </form>
            <div id="list-notes" class="data-list"></div>
        </div>

        <!-- РАЗДЕЛ: НАПОМИНАНИЯ -->
        <div id="tab-reminders" class="tab-content">
            <form id="form-reminders">
                <input type="hidden" name="type" value="remind">
                <div class="form-grid">
                    <div class="field"><label>Событие</label><input type="text" name="title" placeholder="Годовой тест" required></div>
                    <div class="field"><label>Дата дедлайна</label><input type="date" name="date" required></div>
                    <div class="field">
                        <label>Напомнить за</label>
                        <select name="remind_before">
                            <option value="7">За неделю</option>
                            <option value="3">За 3 дня</option>
                            <option value="1">За день</option>
                            <option value="0">В день события</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Создать напоминание</button>
            </form>
            <div id="list-reminders" class="data-list"></div>
        </div>

        <div id="status"></div>
    </div>

    <script>
        // ВСТАВЬТЕ ВАШ URL ИЗ ИНСТРУКЦИИ НИЖЕ:
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFH5SSGSh3d18EPiDI5HJEelTMAOnC6pYy-cYEY-xYZ7eN9jgC7nlqOROmyBvrR5zw/exec'; 

        const status = document.getElementById('status');

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('onclick').includes(tab)));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));
        }

        // Универсальная отправка
        async function handleForm(id) {
            const form = document.getElementById(id);
            form.onsubmit = async (e) => {
                e.preventDefault();
                if (!SCRIPT_URL) {
                    status.innerHTML = '<span class="error">Ошибка: Сначала подключите Google Таблицу</span>';
                    return;
                }
                status.textContent = 'Синхронизация с облаком...';
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                data.timestamp = new Date().toISOString();

                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify(data)
                    });
                    status.innerHTML = '<span class="success">Готово! Данные сохранены в таблицу.</span>';
                    form.reset();
                    setTimeout(loadData, 1000);
                } catch (err) {
                    status.innerHTML = '<span class="error">Ошибка связи: ' + err.message + '</span>';
                }
            };
        }

        ['form-log', 'form-notes', 'form-reminders'].forEach(handleForm);

        async function loadData() {
            if (!SCRIPT_URL) return;
            try {
                const response = await fetch(SCRIPT_URL + '?action=get');
                const allData = await response.json();
                
                renderList(allData.filter(d => d.type === 'log'), 'list-log', 'log');
                renderList(allData.filter(d => d.type === 'note'), 'list-notes', 'note');
                renderList(allData.filter(d => d.type === 'remind'), 'list-reminders', 'remind');
                
                checkReminders(allData.filter(d => d.type === 'remind'));
            } catch (e) {
                console.warn('Не удалось загрузить данные:', e);
            }
        }

        function renderList(items, containerId, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:20px;">Записей пока нет</p>';
                return;
            }

            items.sort((a,b) => new Date(b.date || b.timestamp) - new Date(a.date || a.timestamp));

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = `data-item type-${type}`;
                let body = '';
                if (type === 'log') {
                    body = `
                        <div class="item-header"><span>${item.date}</span> <span>${item.mileage} км</span></div>
                        <div class="item-title">${item.title}</div>
                        <div class="item-price">${item.price || '0.00'} ₪</div>
                    `;
                } else if (type === 'note') {
                    body = `
                        <div class="item-header"><span>${new Date(item.timestamp).toLocaleDateString()}</span></div>
                        <div class="item-title">${item.title}</div>
                        <div class="item-desc">${item.content || ''}</div>
                    `;
                } else {
                    body = `
                        <div class="item-header"><span>Дедлайн: ${item.date}</span></div>
                        <div class="item-title">${item.title}</div>
                        <div style="font-size:12px; color:var(--gold)">Напомнить за ${item.remind_before} дн.</div>
                    `;
                }
                div.innerHTML = body;
                container.appendChild(div);
            });
        }

        function checkReminders(reminders) {
            const alertBox = document.getElementById('alert-section');
            const alertList = document.getElementById('alert-list');
            alertList.innerHTML = '';
            let hasAlerts = false;

            const now = new Date();
            reminders.forEach(r => {
                const deadline = new Date(r.date);
                const diffTime = deadline - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays >= 0 && diffDays <= parseInt(r.remind_before)) {
                    hasAlerts = true;
                    const p = document.createElement('p');
                    p.style.marginBottom = '5px';
                    p.innerHTML = `🏁 <strong>${r.title}</strong> через ${diffDays} дн. (${r.date})`;
                    alertList.appendChild(p);
                }
            });

            alertBox.style.display = hasAlerts ? 'block' : 'none';
        }

        loadData();
    </script>
</body>
</html>
